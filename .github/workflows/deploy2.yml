name: Deploy to Server

# Requires the one-time server setup (both repos cloned under /opt/piphunter and deploy/.env filled in).
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Pull and rebuild on server
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" root@"$SSH_HOST" "/opt/piphunter/pipHunterCiCd/deploy/deploy.sh"
